name: Close inactive games

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expire-inactive-games
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run game:expire-inactive
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
