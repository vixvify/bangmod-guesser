name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Test • Lint • Type Check • Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-only-build-secret-at-least-32-characters
          BETTER_AUTH_URL: https://ci.example.invalid
          NEXT_PUBLIC_API_URL: https://ci.example.invalid

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

  migrate-production:
    name: Deploy Production Migrations
    runs-on: ubuntu-latest
    needs: ci

    environment: production

    concurrency:
      group: production-db-migration
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy Prisma Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
