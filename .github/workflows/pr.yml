name: PR Check

on:
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - run: npm run test:unit

      - run: npm run test:integration

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-only-build-secret-at-least-32-characters
          BETTER_AUTH_URL: https://ci.example.invalid
          NEXT_PUBLIC_API_URL: https://ci.example.invalid

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

